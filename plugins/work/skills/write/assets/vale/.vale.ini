# Minimal Vale config used by scripts/lint.py only when Vale finds no
# .vale.ini of the project's own. It enables Vale's built-in style (no
# downloaded packages) and turns off spelling, which flags most proper nouns
# in product copy. A project .vale.ini, or --vale-config, always wins.
MinAlertLevel = suggestion

[*]
BasedOnStyles = Vale
Vale.Spelling = NO
